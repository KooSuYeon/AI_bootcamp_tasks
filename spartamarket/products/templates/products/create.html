{% extends "base.html" %}
{% load static %}
{% load humanize %}

<link rel="stylesheet" href="{% static 'css/createform.css' %}">

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <a href="{% url 'products:products' %}" >
                <i class="fa-sharp fa-solid fa-arrow-left"></i>
                <span>
                    Back to Products
                </span>
            </a>
            <br><br>
            <form action="{% url 'products:create' %}" method="POST" enctype="multipart/form-data" class="createform-container border p-4 rounded">
                {% csrf_token %}

                <!-- Product Name -->
                <div class="form-group mb-3">
                    <label for="id_name" class="form-label">Title:</label>
                    {{ form.name }}
                </div>

                <!-- Description -->
                <div class="form-group mb-3">
                    <label for="id_description" class="form-label">Description:</label>
                    {{ form.description }}
                </div>

                <!-- Category -->
                <div class="form-group mb-3">
                    <label for="id_type" class="form-label">Category:</label>
                    {{ form.type }}
                    <small class="form-text text-muted">Choose a category that best fits the product.</small>
                </div>

                <!-- Price -->
                <div class="form-group mb-3">
                    <label for="id_price" class="form-label">Price:</label>
                    <input type="text" id="id_price" name="price" class="form-control" oninput="formatPrice(this)" value="{{ form.price.value }}" >
                </div>


                <!-- Image -->
                <div class="form-group mb-3">
                    <label for="id_product_image" class="form-label">Product Image:</label>
                    {{ form.image }}
                </div>

                
                <hr></hr>
                <div class="row justify-content-center mt-4">
                    <button type="submit" class="btn btn-danger custom-button">
                        <i class="fa-solid fa-plus fa-lg me-2"></i>
                          Register Product
                    </button>
                </div>
            </div>
            </form>
            
        </div>
    </div>
</div>

<script>
    function formatPrice(input) {
        let value = input.value.replace(/[^\d]/g, ''); // 숫자만 남기기
        if (value) {
            value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ","); // 천 단위로 쉼표 추가
        }
        input.value = value;
    }
</script>
{% endblock content %}
